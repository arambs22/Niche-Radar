services:
  - type: web
    name: niche-radar
    env: node
    plan: free
    buildCommand: npm install && npm run build
    # preDeployCommand would be the cleaner spot for this, but it's a paid-plan-only
    # feature on Render — migrations run here instead. Safe on every start (including
    # free-tier wake-from-sleep): drizzle-kit only applies pending migrations, no-op otherwise.
    startCommand: npm run db:migrate && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: niche-radar-db
          property: connectionString
      # Secrets: set manually in the Render dashboard, never committed here.
      - key: JWT_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false

databases:
  - name: niche-radar-db
    plan: free
