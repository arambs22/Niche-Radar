services:
  - type: web
    name: niche-radar
    env: node
    plan: free
    # --include=dev is required: NODE_ENV=production (set below) makes npm skip
    # devDependencies otherwise, but the build needs typescript/@types/* to compile
    # and the start command needs tsx to run migrations.
    buildCommand: npm install --include=dev && npm run build
    # preDeployCommand would be the cleaner spot for this, but it's a paid-plan-only
    # feature on Render — migrations run here instead. Safe on every start (including
    # free-tier wake-from-sleep): drizzle-kit only applies pending migrations, no-op otherwise.
    startCommand: npm run db:migrate && npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Postgres is hosted on Neon (free tier), not Render — Render's own
      # free Postgres deletes itself 44 days after creation with no
      # backups, which isn't acceptable for real user data. Set manually
      # in the Render dashboard, never committed here.
      - key: DATABASE_URL
        sync: false
      # Public app URL — used to build verification/reset links in emails.
      - key: APP_URL
        value: https://niche-radar.onrender.com
      # Secrets: set manually in the Render dashboard, never committed here.
      - key: JWT_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      # Email (Resend) — not configured yet (no verified domain). Until set,
      # verification/reset emails just get logged instead of sent, same as
      # local dev without RESEND_API_KEY.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
