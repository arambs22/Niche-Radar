name: Collect Trends

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scheduled collection
        run: |
          curl --fail --max-time 3600 -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.NICHERADAR_URL }}/api/internal/collect"
